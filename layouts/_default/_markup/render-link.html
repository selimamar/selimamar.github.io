{{ $destination := .Destination }}
{{ $external := or (strings.HasPrefix $destination "http://") (strings.HasPrefix $destination "https://") (strings.HasPrefix $destination "mailto:") (strings.HasPrefix $destination "#") }}
<a href="{{ if $external }}{{ $destination | safeURL }}{{ else }}{{ $destination | relURL }}{{ end }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
