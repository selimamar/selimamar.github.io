baseURL = "https://selim-amar.example/"
locale = "en-US"
title = "Selim Amar — Mathematics"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Personal academic website of Selim Amar, PhD student in Mathematics at Stanford University."
  name = "Selim Amar"
  role = "PhD Student in Mathematics"
  institution = "Stanford University"
  location = "Stanford, California, USA"
  email = "selama@stanford.edu"
  arxiv = "https://arxiv.org/search/?query=Amar%2C+Selim&searchtype=author"
  scholar = ""
  researchInterests = [
    "Microlocal Analysis",
    "Partial Differential Equations",
    "Spectral Theory",
    "Dynamical Systems"
  ]

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10
[[menus.main]]
  name = "Research"
  pageRef = "/research"
  weight = 20
[[menus.main]]
  name = "Random Projects"
  pageRef = "/random-projects"
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = false

[caches]
  [caches.images]
    dir = ':cacheDir/images'
